[theme]
[theme.overrides]
separator = ""

[icons]
icons = "material-nf"

[[block]]
block = "focused_window"
[block.format]
full = " $title.str() |"

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90
[[block.click]]
button = "left"
cmd = "alacritty -e btop"

[[block]]
block = "memory"
format = " $icon $mem_used/$mem_total "
[[block.click]]
button = "left"
cmd = "alacritty -e btop"

[[block]]
block = "temperature"
format = " $icon $max "
interval = 10
idle = 45
info = 60
warning = 80
[[block.click]]
button = "left"
cmd = "alacritty -e btop"

[[block]]
block = "backlight"
missing_format = ""

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "net"
format = " $icon {$signal_strength $ssid|Wired} "
[[block.click]]
button = "left"
cmd = "alacritty -e nmtui"

[[block]]
block = "battery"
full_format = " $icon $percentage "


[[block]]
block = "time"
interval = 60
format = " $timestamp.datetime(f:'%a %R') "
